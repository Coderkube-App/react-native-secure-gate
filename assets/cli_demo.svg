<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .fm{font-family:'Fira Code',monospace}.fs{font-family:'Inter',sans-serif}

      /* Privacy Shield Fade Timeline */
      @keyframes shieldFade {
        0%, 25% { opacity: 0; visibility: hidden; }
        26%, 87.5% { opacity: 1; visibility: visible; }
        87.6%, 100% { opacity: 0; visibility: hidden; }
      }
      .privacy-overlay { animation: shieldFade 12s ease-in-out infinite; }

      /* FaceID Scanner Prompt Timeline */
      @keyframes faceIdShow {
        0%, 25% { opacity: 0; visibility: hidden; }
        26%, 54.2% { opacity: 1; visibility: visible; }
        54.3%, 100% { opacity: 0; visibility: hidden; }
      }
      .faceid-prompt { animation: faceIdShow 12s ease-in-out infinite; }

      /* FaceID Scan Line Sweeper */
      @keyframes beamSweep {
        0%, 100% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(48px); opacity: 1; }
      }
      .scanner-beam { animation: beamSweep 1.8s ease-in-out infinite; }

      /* Shake Feedback Animation (FaceID fail) */
      @keyframes shakeIcon {
        0%, 80%, 100% { transform: translateX(0); }
        85%, 95% { transform: translateX(-5px); }
        90% { transform: translateX(5px); }
      }
      .faceid-shaker { animation: shakeIcon 5s linear infinite; }

      /* Keypad Slide Up Timeline */
      @keyframes keypadShow {
        0%, 54.2% { opacity: 0; transform: translateY(80px); visibility: hidden; }
        56.2%, 87.5% { opacity: 1; transform: translateY(0); visibility: visible; }
        87.6%, 100% { opacity: 0; transform: translateY(80px); visibility: hidden; }
      }
      .keypad-prompt { animation: keypadShow 12s cubic-bezier(0.25, 1, 0.5, 1) infinite; }

      /* Passcode dots timeline */
      @keyframes dotsAnim {
        0%, 58.3% { content: "○ ○ ○ ○"; } /* 0 dots filled */
        66.7% { content: "● ○ ○ ○"; } /* 1 dot */
        75.0% { content: "● ● ○ ○"; } /* 2 dots */
        83.3% { content: "● ● ● ○"; } /* 3 dots */
        91.7%, 100% { content: "● ● ● ●"; } /* 4 dots */
      }
      /* Fallback text dot simulation */
      @keyframes showDot1 { 0%, 62.4% { fill: rgba(255,255,255,0.2); } 62.5%, 100% { fill: #10b981; } }
      @keyframes showDot2 { 0%, 70.8% { fill: rgba(255,255,255,0.2); } 70.9%, 100% { fill: #10b981; } }
      @keyframes showDot3 { 0%, 79.1% { fill: rgba(255,255,255,0.2); } 79.2%, 100% { fill: #10b981; } }
      @keyframes showDot4 { 0%, 85.3% { fill: rgba(255,255,255,0.2); } 85.4%, 100% { fill: #10b981; } }
      .pdot1 { animation: showDot1 12s step-end infinite; }
      .pdot2 { animation: showDot2 12s step-end infinite; }
      .pdot3 { animation: showDot3 12s step-end infinite; }
      .pdot4 { animation: showDot4 12s step-end infinite; }

      /* Visual state timeline indicator */
      @keyframes indicatorState {
        0%, 25%, 87.6%, 100% { opacity: 1; }
        25.1%, 87.5% { opacity: 0; }
      }
      @keyframes indicatorShielded {
        25.1%, 87.5% { opacity: 1; }
        0%, 25%, 87.6%, 100% { opacity: 0; }
      }
      .unlocked-label { animation: indicatorState 12s step-end infinite; }
      .shielded-label { animation: indicatorShielded 12s step-end infinite; }

      /* Typewriter command line */
      @keyframes type1 { 0%, 5% { width: 0; } 18%, 100% { width: 210px; } }
      @keyframes type2 { 0%, 40% { width: 0; } 58%, 100% { width: 125px; } }
      .cmd1 { animation: type1 12s linear infinite; }
      .cmd2 { animation: type2 12s linear infinite; }

      @keyframes cursor1Move {
        0%, 5% { transform: translateX(0); opacity: 1; }
        18% { transform: translateX(210px); opacity: 1; }
        22%, 100% { transform: translateX(210px); opacity: 0; }
      }
      @keyframes cursor2Move {
        0%, 40% { transform: translateX(0); opacity: 0; }
        41% { transform: translateX(0); opacity: 1; }
        58% { transform: translateX(125px); opacity: 1; }
        63%, 100% { transform: translateX(125px); opacity: 0; }
      }
      .cur1 { animation: cursor1Move 12s linear infinite, blink 1s step-end infinite; }
      .cur2 { animation: cursor2Move 12s linear infinite, blink 1s step-end infinite; }

      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      /* Terminal logs timings */
      @keyframes showL1 { 0%, 21.9% { opacity: 0; } 22%, 100% { opacity: 1; } }
      @keyframes showL2 { 0%, 39.9% { opacity: 0; } 40%, 100% { opacity: 1; } }
      @keyframes showL3 { 0%, 59.9% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes showL4 { 0%, 69.9% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes showL5 { 0%, 82.9% { opacity: 0; } 83%, 100% { opacity: 1; } }
      @keyframes showL6 { 0%, 91.9% { opacity: 0; } 92%, 100% { opacity: 1; } }
      .log1 { animation: showL1 12s step-end infinite; }
      .log2 { animation: showL2 12s step-end infinite; }
      .log3 { animation: showL3 12s step-end infinite; }
      .log4 { animation: showL4 12s step-end infinite; }
      .log5 { animation: showL5 12s step-end infinite; }
      .log6 { animation: showL6 12s step-end infinite; }
    </style>

    <!-- Filters &amp; Shadows -->
    <filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shield-blur">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <clipPath id="phone-clip">
      <rect x="80" y="60" width="220" height="240" rx="28" />
    </clipPath>

    <!-- Background Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Typewriter clips -->
    <clipPath id="clip-c1"><rect class="cmd1" x="16" y="-8" width="0" height="20" /></clipPath>
    <clipPath id="clip-c2"><rect class="cmd2" x="16" y="36" width="0" height="20" /></clipPath>
  </defs>

  <!-- Base Canvas -->
  <rect fill="#04050a" width="860" height="520" rx="16" />
  <rect fill="url(#bg-glow)" width="860" height="520" rx="16" />

  <!-- Top Title -->
  <text class="fs" x="430" y="30" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="3" opacity="0.6">BIOMETRIC SHIELD &amp; PASSCODE GATE OVERLAY</text>

  <!-- ════════════ COLUMN 1: DEVICE PREVIEW (PRIVACY OVERLAY) ════════════ -->
  <g transform="translate(0, 0)" filter="url(#ds)">
    <!-- Device Frame Outer -->
    <rect x="76" y="56" width="228" height="248" rx="32" fill="#1e1e24" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    
    <!-- Render Area (Clipped Phone Screen) -->
    <g clip-path="url(#phone-clip)">
      <!-- Backdrop dashboard showing sensitive content -->
      <rect x="80" y="60" width="220" height="240" fill="#0b0f19" />
      <text class="fs" x="96" y="86" fill="#ffffff" font-size="10" font-weight="700">Client Portfolio</text>
      <text class="fs" x="96" y="100" fill="#64748b" font-size="7.5" font-weight="500">Balance USD</text>
      <text class="fs" x="96" y="118" fill="#10b981" font-size="13" font-weight="700">$18,443.02</text>
      
      <!-- Mini graph -->
      <path d="M96,160 Q120,130 150,150 T200,120 T260,140" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle cx="200" cy="120" r="3" fill="#38bdf8" />
      
      <!-- Privacy Shield overlay (Animates Blur/Opacity) -->
      <g class="privacy-overlay">
        <!-- Blur effect -->
        <rect x="80" y="60" width="220" height="240" fill="rgba(15, 23, 42, 0.4)" filter="url(#shield-blur)" />
        <rect x="80" y="60" width="220" height="240" fill="rgba(15, 23, 42, 0.85)" />
        
        <!-- FaceID prompt display (Step 1) -->
        <g class="faceid-prompt" transform="translate(80, 60)">
          <g class="faceid-shaker">
            <!-- Face ID Icon -->
            <path d="M85,90 h10 M125,90 h10 M90,85 v10 M130,85 v10 M95,115 h30 M110,105 v15 M90,125 Q110,145 130,125" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />
            <rect x="80" y="75" width="60" height="70" rx="8" fill="none" stroke="#a78bfa" stroke-dasharray="4,4" stroke-width="1" />
          </g>
          
          <text class="fs" x="110" y="165" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle">Evaluating FaceID...</text>
          
          <!-- Scanning line beam -->
          <line class="scanner-beam" x1="75" y1="86" x2="145" y2="86" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />
        </g>
        
        <!-- Keypad prompt display (Step 2 - fallback) -->
        <g class="keypad-prompt" transform="translate(80, 60)">
          <text class="fs" x="110" y="32" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">Enter Passcode</text>
          
          <!-- Keypad Passcode Dots -->
          <g transform="translate(70, 48)">
            <circle class="pdot1" cx="12" cy="0" r="4.5" />
            <circle class="pdot2" cx="32" cy="0" r="4.5" />
            <circle class="pdot3" cx="52" cy="0" r="4.5" />
            <circle class="pdot4" cx="72" cy="0" r="4.5" />
          </g>
          
          <!-- Keypad layout grids -->
          <g transform="translate(45, 68)" fill="rgba(255,255,255,0.06)">
            <!-- Row 1 -->
            <rect x="0" y="0" width="36" height="24" rx="6" /><text class="fm" x="18" y="16" fill="#8b949e" font-size="9.5" text-anchor="middle">1</text>
            <rect x="47" y="0" width="36" height="24" rx="6" /><text class="fm" x="65" y="16" fill="#8b949e" font-size="9.5" text-anchor="middle">2</text>
            <rect x="94" y="0" width="36" height="24" rx="6" /><text class="fm" x="112" y="16" fill="#8b949e" font-size="9.5" text-anchor="middle">3</text>
            <!-- Row 2 -->
            <rect x="0" y="32" width="36" height="24" rx="6" /><text class="fm" x="18" y="48" fill="#8b949e" font-size="9.5" text-anchor="middle">4</text>
            <rect x="47" y="32" width="36" height="24" rx="6" /><text class="fm" x="65" y="48" fill="#8b949e" font-size="9.5" text-anchor="middle">5</text>
            <rect x="94" y="32" width="36" height="24" rx="6" /><text class="fm" x="112" y="48" fill="#8b949e" font-size="9.5" text-anchor="middle">6</text>
            <!-- Row 3 -->
            <rect x="0" y="64" width="36" height="24" rx="6" /><text class="fm" x="18" y="80" fill="#8b949e" font-size="9.5" text-anchor="middle">7</text>
            <rect x="47" y="64" width="36" height="24" rx="6" /><text class="fm" x="65" y="80" fill="#8b949e" font-size="9.5" text-anchor="middle">8</text>
            <rect x="94" y="64" width="36" height="24" rx="6" /><text class="fm" x="112" y="80" fill="#8b949e" font-size="9.5" text-anchor="middle">9</text>
            <!-- Row 4 -->
            <rect x="47" y="96" width="36" height="24" rx="6" /><text class="fm" x="65" y="112" fill="#8b949e" font-size="9.5" text-anchor="middle">0</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Caption -->
    <text class="fs" x="190" y="325" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">PRIVACY SHIELD ENGAGED</text>
  </g>

  <!-- Flow connecting vector lines -->
  <line x1="310" y1="180" x2="540" y2="180" stroke="rgba(124, 92, 246, 0.25)" stroke-width="1.5" stroke-dasharray="4,4" />
  <polygon points="540,176 548,180 540,184" fill="#8b5cf6" opacity="0.6" />

  <!-- ════════════ COLUMN 3: SECURITY CONTROLLER & METADATA ════════════ -->
  <g transform="translate(550, 60)" filter="url(#ds)">
    <rect width="230" height="240" rx="12" fill="#0d1117" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5" />
    <rect width="230" height="24" rx="12" fill="#161b22" />
    <rect y="16" width="230" height="8" fill="#161b22" />
    <text class="fs" x="115" y="15" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">Privacy Shield Controller</text>

    <g transform="translate(16, 42)">
      <!-- Mode label indicators -->
      <text class="fs" y="12" fill="#64748b" font-size="9" font-weight="600" letter-spacing="0.5">SHIELD STATE</text>
      
      <!-- Shield active vs idle label overlays -->
      <g class="unlocked-label">
        <rect y="20" width="94" height="24" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.2)" />
        <text class="fs" x="47" y="35" fill="#10b981" font-size="9.5" font-weight="700" text-anchor="middle">UNLOCKED</text>
      </g>
      <g class="shielded-label">
        <rect y="20" width="94" height="24" rx="4" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.2)" />
        <text class="fs" x="47" y="35" fill="#ef4444" font-size="9.5" font-weight="700" text-anchor="middle">ACTIVE SHIELD</text>
      </g>

      <!-- Fallback options -->
      <g transform="translate(0, 64)">
        <text class="fs" y="12" fill="#64748b" font-size="9" font-weight="600" letter-spacing="0.5">BIOMETRICS FALLBACK</text>
        <text class="fm" y="28" fill="#a5b4fc" font-size="10">fallbackToPasscode: true</text>
        <text class="fm" y="44" fill="#a5b4fc" font-size="10">passcodeLength: 4</text>
      </g>

      <!-- Active audit trace log metadata box -->
      <rect y="146" width="198" height="54" rx="6" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.2)" />
      <text class="fs" x="12" y="162" fill="#06b6d4" font-size="9" font-weight="700">NATIVE RUNTIME AUDIT</text>
      <text class="fs" x="12" y="176" fill="#8b949e" font-size="8" font-weight="500">Hardware FaceID status: Enrolled</text>
      <text class="fs" x="12" y="188" fill="#8b949e" font-size="8" font-weight="500">Keychain Storage: AES Key Verified</text>
    </g>
  </g>

  <!-- ════════════ BOTTOM PANEL: LIVE DEVELOPER TERMINAL ════════════ -->
  <g transform="translate(30, 310)" filter="url(#ds)">
    <rect width="800" height="186" rx="10" fill="rgba(13, 17, 23, 0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="800" height="24" rx="10" fill="#161b22" />
    <rect y="16" width="800" height="8" fill="#161b22" />
    <circle cx="16" cy="12" r="4" fill="#ff5f56" /><circle cx="28" cy="12" r="4" fill="#ffbd2e" /><circle cx="40" cy="12" r="4" fill="#27c93f" />
    <text class="fs" x="400" y="16" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">developer-console — react-native-secure-gate</text>
    <line x1="0" y1="24" x2="800" y2="24" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Terminal Output -->
    <g transform="translate(20, 32)">
      <!-- Line 1: npm install command -->
      <text class="fm" y="4" font-size="9.5" fill="#58a6ff" font-weight="700">❯</text>
      <text class="fm" x="16" y="4" font-size="9.5" fill="#c9d1d9" clip-path="url(#clip-c1)">npm install react-native-secure-gate</text>
      <rect class="cur1" x="16" y="-7" width="6" height="12" fill="#58a6ff" />

      <!-- Success log after installation -->
      <g class="log1">
        <text class="fm" x="16" y="26" font-size="9.5" fill="#57ab5a">✔ Installed react-native-secure-gate@1.0.0 (Expo &amp; Bare Biometric Auth Shield)</text>
      </g>

      <!-- Line 2: executing script -->
      <g class="log2">
        <text class="fm" y="48" font-size="9.5" fill="#58a6ff" font-weight="700">❯</text>
        <text class="fm" x="16" y="48" font-size="9.5" fill="#c9d1d9" clip-path="url(#clip-c2)">node run-gate-test.js</text>
        <rect class="cur2" x="16" y="37" width="6" height="12" fill="#58a6ff" />
      </g>

      <!-- Execution logs -->
      <g class="log3" transform="translate(16, 72)">
        <text class="fm" font-size="9.5" fill="#8b949e">[Secure Gate] App background state changed: active -> background</text>
      </g>
      <g class="log4" transform="translate(16, 92)">
        <text class="fm" font-size="9.5" fill="#8b949e">[Secure Gate] Privacy shield active. Rendering overlay...</text>
      </g>
      <g class="log5" transform="translate(16, 114)">
        <text class="fm" font-size="9.5" fill="#ef4444">[BIOMETRICS] Local authentication failed (userCancel). Fallback PIN active...</text>
      </g>
      <g class="log6" transform="translate(16, 134)">
        <text class="fm" font-size="9.5" fill="#10b981" font-weight="700">[PASSCODE] Keypad PIN authorized! Shield dismissed. App fully active.</text>
      </g>
    </g>
  </g>
</svg>
